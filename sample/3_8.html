<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>three.js FPS表示サンプル (Stats.jsなし)</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #fps-counter {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            font-family: monospace;
            font-size: 16px;
            border-radius: 3px;
            z-index: 100; /* Three.jsのキャンバスより手前に表示 */
        }
    </style>
</head>
<body>
    <div id="fps-counter">FPS: --</div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';

        let scene, camera, renderer, cube;
        let lastTime = 0;
        let frameCount = 0;
        const fpsElement = document.getElementById('fps-counter');

        init();
        animate();

        function init() {
            // シーンの作成
            scene = new THREE.Scene();

            // カメラの作成 (視野角, アスペクト比, near, far)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // レンダラーの作成
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 立方体の作成
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            cube = new THREE.Mesh(geometry, material);
            scene.add(cube);

            // 環境光の追加
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // 平行光源の追加
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(0, 1, 1).normalize();
            scene.add(directionalLight);

            // ウィンドウのリサイズイベントハンドラ
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);

            // FPSの計算と表示
            frameCount++;
            if (time - lastTime >= 1000) { // 1秒ごとに更新
                const fps = frameCount / ((time - lastTime) / 1000);
                frameCountText = `FPS: ${Math.round(fps)}`;
                frameCount = 0;
                lastTime = time;
            }

            // 立方体を回転させる
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;

            // シーンをレンダリング
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
