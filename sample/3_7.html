<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Text with Canvas Texture - Double-Sided</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        const textContent = 'こんにちは Three.js!';
        const fontSize = 80;
        context.font = `Bold ${fontSize}px Arial`;

        const textMetrics = context.measureText(textContent);
        const textWidth = textMetrics.width;
        const textHeight = fontSize;

        const padding = 20;

        canvas.width = textWidth + padding * 2;
        canvas.height = textHeight + padding * 2;

        context.font = `Bold ${fontSize}px Arial`;
        context.fillStyle = 'white';
        context.textAlign = 'center';
        context.textBaseline = 'middle';

        context.fillText(textContent, canvas.width / 2, canvas.height / 2);

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;

        // --- ここを修正 ---
        const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide // これを追加する
            // depthWrite: false // 必要に応じて
        });
        // --- 修正ここまで ---

        const planeWidth = canvas.width / 100;
        const planeHeight = canvas.height / 100;
        const planeGeometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
        const textMesh = new THREE.Mesh(planeGeometry, material);
        scene.add(textMesh);

        camera.position.z = 5;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(0, 1, 1);
        scene.add(directionalLight);

        function animate() {
            requestAnimationFrame(animate);
            textMesh.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
