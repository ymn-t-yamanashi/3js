<!DOCTYPE html>
<html>
<head>
    <title>Three.js Cloud</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, particles;

        function init() {
            // シーンの作成
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0xcccccc, 0.002); // 霧を追加して奥行き感を出す

            // カメラの作成
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.z = 1000;

            // レンダラーの作成
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 雲のパーティクルの作成
            const geometry = new THREE.BufferGeometry();
            const vertices = [];

            // 雲を構成するパーティクルの数
            const particleCount = 5000;
            for (let i = 0; i < particleCount; i++) {
                const x = Math.random() * 2000 - 1000;
                const y = Math.random() * 2000 - 1000;
                const z = Math.random() * 2000 - 1000;
                vertices.push(x, y, z);
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));

            // マテリアルの作成 (テクスチャに白い円を使うとより雲らしくなります)
            // ここではシンプルな白い点を使っていますが、実際の雲の画像を使うとよりリアルになります
            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 30, // パーティクルのサイズ
                transparent: true,
                blending: THREE.AdditiveBlending, // 加算合成で光の表現を豊かにする
                map: generateSprite() // スプライト画像を生成
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // ウィンドウのリサイズイベント
            window.addEventListener('resize', onWindowResize, false);
        }

        // スプライト画像を生成する関数 (白い円)
        function generateSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;

            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(canvas.width / 2, canvas.height / 2, 0, canvas.width / 2, canvas.height / 2, canvas.width / 2);
            gradient.addColorStop(0.1, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,255,255,0.7)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');

            context.fillStyle = gradient;
            context.fillRect(0, 0, canvas.width, canvas.height);

            return new THREE.CanvasTexture(canvas);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 雲を少しずつ動かす
            particles.rotation.y -= 0.0005;
            particles.rotation.x -= 0.0002;

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
